[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-mvp"
version = "0.1.0"
description = "Real-time voice agent: mic -> VAD -> streaming STT -> Claude (with tools) -> streaming TTS -> speaker."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anubhav Jain", email = "anubhav27nov@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "anthropic>=1.17",
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
voice-agent = "voice_agent.__main__:main"

[tool.setuptools]
packages = ["voice_agent", "voice_agent.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real provider APIs; skipped unless the API keys are set"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent", "conftest"]
