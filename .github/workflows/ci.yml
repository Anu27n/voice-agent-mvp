name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
        shell: bash
      - name: Test
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t voice-agent .
      - name: Smoke test the container
        run: |
          docker run -d --name agent -p 8000:8000 voice-agent
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q "<title>Voice Agent</title>"
          curl -fsS -X POST http://127.0.0.1:8000/sessions | grep -q session_id
          curl -fsS http://127.0.0.1:8000/metrics | grep -q voice_agent_active_calls
      - name: Container logs
        if: always()
        run: docker logs agent || true
